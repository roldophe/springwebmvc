spring.application.name=springwebmvc
#Configure Data Source
spring.datasource.username=mvcuser
spring.datasource.password=mvcpass
spring.datasource.url=jdbc:postgresql://localhost:5477/mvcdb
spring.datasource.driver-class-name=org.postgresql.Driver

#FILE UPLOAD CONFIGURATION
file.server-path=./.data/file-uploads/
file.client-path=/file/**
file.base-uri=http://localhost:8080/file/
file.download-uri=http://localhost:8080/files/download/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
